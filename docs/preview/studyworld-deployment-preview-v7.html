.archive-heading{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:44px 0 18px}.archive-heading h2{margin:0;font-size:28px;letter-spacing:-.04em}.archive-heading p{margin:7px 0 0;color:var(--muted);font-size:14px}.modal-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.room-head-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.empty-space{padding:42px 26px;border:1px dashed #bbb6aa;border-radius:var(--r2);text-align:center;color:var(--muted);background:rgba(251,250,247,.45)}.empty-space h2{margin:0 0 8px;color:var(--ink)}
.builder{display:grid;gap:18px}.builder-step{padding:26px}.step-head{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start;margin-bottom:22px}.step-num{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:850}.step-head h2{margin:0 0 5px;font-size:23px;letter-spacing:-.035em}.step-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.upload-zone{display:grid;place-items:center;min-height:170px;border:1px dashed #aaa59a;border-radius:var(--r2);background:#f6f4ee;text-align:center;padding:24px;cursor:pointer}.upload-zone:hover{background:#f1eee7}.upload-zone strong{display:block;font-size:17px}.upload-zone span{display:block;margin-top:7px;color:var(--muted);font-size:12px}.upload-zone input{position:absolute;opacity:0;pointer-events:none}.file-list{display:grid;gap:8px;margin-top:12px}.file-item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:13px}.file-item small{color:var(--muted)}

.room-detail-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.6fr);gap:18px}.personal-main{padding:30px}.personal-main h2{margin:0 0 8px;font-size:28px;letter-spacing:-.04em}.material-list{display:grid;gap:8px;margin:18px 0 28px}.material-row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.material-row span:last-child{color:var(--muted)}.instruction-box{padding:18px;border-radius:14px;background:#edebe4;color:var(--muted);font-size:14px;line-height:1.7}.plan-list{display:grid;gap:9px;margin-top:18px}.plan-item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:13px}.plan-item b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px}.plan-item strong{font-size:14px}.plan-item small{color:var(--muted)}.room-side{display:grid;gap:14px}.room-side .panel{box-shadow:none}.lockbtn{width:100%;margin-top:10px}

.template-card small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;margin-bottom:12px}.template-card strong{display:block;font-size:15px;line-height:1.45}.template-card span{display:block;color:var(--muted);font-size:11px;margin-top:7px}

.archive-pick.selected{background:#e8ece7;border-color:#a8b4ab}.archive-pick strong{font-size:13px}.archive-pick small{display:block;color:var(--muted);font-size:10px;margin-top:3px}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2300)}
function load(){try{const g=JSON.parse(localStorage.getItem(GUEST_KEY)||'null');if(g&&g.expiresAt>Date.now())state.guest=g;else localStorage.removeItem(GUEST_KEY)}catch{}try{state.cooldowns=JSON.parse(localStorage.getItem(COOLDOWN_KEY)||'{}')||{}}catch{}try{state.lastQuizIds=JSON.parse(localStorage.getItem(QUIZ_KEY)||'[]')||[]}catch{}}
function saveGuest(){if(state.member||!state.guest)return;state.guest.score=state.score;state.guest.expiresAt=Date.now()+THREE_DAYS;localStorage.setItem(GUEST_KEY,JSON.stringify(state.guest))}
function nav(page){state.page=page;render();scrollTo({top:0,behavior:'smooth'})}

function home(){view.innerHTML=`<section class="page home-page"><div class="home-hero-grid"><div class="hero"><p class="hero-kicker">STUDYWORLD</p><h1>내 방식대로 넓히는 배움의 세계</h1><p class="copy">타인의 기준이 아닌, 내 스타일에 딱 맞춘 학습공간을 만나보세요.</p><div class="actions">${button('내 학습공간 만들기',true,'data-go="rooms"')}${button('광장 둘러보기',false,'data-go="plaza"')}</div></div><div class="world-wrap"><div class="world-glow" aria-hidden="true"></div><div class="world-scene" aria-label="숲 속에서 주민들이 각자의 학습공간을 만들어가는 모습"><i class="world-sun"></i><i class="hill one"></i><i class="hill two"></i><i class="tree t1"></i><i class="tree t2"></i><i class="tree t3"></i><i class="tree t4"></i><div class="cabin"><i class="cabin-roof"></i><i class="cabin-base"></i><i class="door"></i><i class="window"></i></div><i class="builder-person bp1"></i><i class="builder-person bp2"></i><i class="builder-person bp3"></i><div class="scene-note"><b>각자의 배움이 모여 하나의 세계가 됩니다.</b></div></div></div></div><div class="features"><article><h2>광장</h2><p>공개적·공익적 학습 스터디를 둘러보고 필요한 공간에 참여합니다.</p></article><article><h2>나의 학습공간</h2><p>목표부터 시작하고 자료를 더할수록 분석과 학습계획이 정교해집니다.</p></article><article><h2>계속 조정하기</h2><p>공부하면서 자료와 방식, 화면 구성을 언제든 다시 다듬을 수 있습니다.</p></article></div></section>`}
function scene(study){return `<div class="scene ${study.scene}"><div class="scene-top"><span class="live"><i class="dot"></i>LIVE ARCHIVE</span><span>${study.people} / ${study.capacity}</span></div><div class="people"><i class="person p1"></i><i class="person p2"></i><i class="person p3"></i></div><div class="desk"></div><div class="scene-caption"><strong>${esc(study.title)}</strong><small>최근 실황을 바탕으로 한 공간 미리보기</small></div></div>`}
function getCooldown(id){const until=Number(state.cooldowns[id]||0);if(until<=Date.now()){if(until){delete state.cooldowns[id];localStorage.setItem(COOLDOWN_KEY,JSON.stringify(state.cooldowns))}return 0}return until-Date.now()}
function fmt(ms){const m=Math.max(0,Math.ceil(ms/60000));return m>=60?`${Math.floor(m/60)}시간 ${m%60}분`:`${m}분`}
function plaza(){view.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">PUBLIC LEARNING PLAZA</p><h1 class="title">광장</h1><p class="copy">Basic Test로 가볍게 시작하고, 공개적·공익적 목적으로 운영되는 실황 스터디에 참여할 수 있습니다.</p></div><span class="publicpill">OPEN · PUBLIC INTEREST</span></div><section class="basic-test"><div><p class="eyebrow">BASIC TEST · PLAZA FIRST</p><h2>광장에 들어오면<br>가장 먼저, 기본 테스트</h2><p>과학·역사·지리·문화의 기본 상식을 10문제로 확인합니다. 회원·비회원 모두 공개 스코어에 참여할 수 있고, 재시험에는 직전 문항을 우선 제외합니다.</p><button class="pillbtn" data-basic-test>Basic Test 시작하기</button></div><div class="basic-test-meta"><div><small>QUESTION BANK</small><strong>${questionBank.length}</strong><small>매회 10문제</small></div><div><small>PUBLIC SCORE</small><strong>OPEN</strong><small>회원 · 비회원 모두 확인</small></div></div></section><div class="policy"><b>광장 원칙</b><p>공개적·공익적 학습 목적의 스터디만 허용합니다. 자발적 퇴장 후 같은 방은 1시간 재입장 제한, 네트워크 오류는 3분 재접속 유예를 적용합니다.</p></div><section class="plaza-create"><div><p class="eyebrow">OPEN A PUBLIC STUDY · LOCKED</p><h3>광장 스터디 개설</h3><p>개인 학습 출석 3일 이상 · 1인당 동시 1개 · 최대 30명 · 개설 후 24시간 내 방장 포함 3명 미달 또는 활동 없음 시 자동 폐쇄. 방장 혜택과 운영 평가 기능은 준비 중입니다.</p></div><button class="pillbtn secondary" disabled>🔒 준비 중</button></section><div class="archive-heading"><div><h2>실황 스터디 아카이브</h2><p>입장하기 전에 분위기와 운영 방식부터 확인하세요. 화면에는 집중 중인 일부 멤버만 보여주고 나머지는 목록으로 처리합니다.</p></div><span class="publicpill">LIVE ARCHIVE · MAX 30</span></div><div class="archive-grid">${studies.map(s=>{const cd=getCooldown(s.id);return `<article class="study-card">${scene({...s,capacity:Math.min(30,s.capacity)})}<div class="study-body"><div class="study-meta">${s.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><h2>${esc(s.title)}</h2><p>${esc(s.summary)}</p><div class="study-foot"><small>${esc(s.schedule)} · ${esc(s.host)}${cd?`<br><span class="cooldown">재입장까지 ${fmt(cd)}</span>`:''}</small><button class="pillbtn ${cd?'secondary':''}" data-study-detail="${s.id}" ${cd?'disabled':''}>${cd?'재입장 제한':'입장하기'}</button></div></div></article>`}).join('')}</div></section>`}
function showStudyDetail(id){const s=studies.find(x=>x.id===id);if(!s)return;const cd=getCooldown(id);modalRoot.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="studyTitle"><p class="eyebrow">BEFORE ENTERING</p><h2 id="studyTitle">${esc(s.title)}</h2><p>${esc(s.summary)}</p><div class="detail-grid"><div><small>운영 시간</small><strong>${esc(s.schedule)}</strong></div><div><small>현재 참여</small><strong>${s.people}명</strong></div><div><small>방장</small><strong>${esc(s.host)}</strong></div><div><small>퇴장 정책</small><strong>자발적 퇴장 후 1시간</strong></div></div><div class="notice"><b>이 스터디의 약속</b><br>${esc(s.rule)}<br><br>네트워크 오류로 연결이 끊긴 경우 3분 내에는 쿨타임 없이 같은 세션으로 복귀할 수 있습니다.</div>${cd?`<p class="cooldown">현재 재입장 제한 중 · ${fmt(cd)} 남음</p><div class="modal-actions">${button('닫기',true,'data-close-modal')}</div>`:`<div class="modal-actions">${button('닫기',true,'data-close-modal')}${button('입장하기',false,`data-enter-study="${s.id}"`)}</div>`}</section></div>`;bind()}
function ensureGuest(next){if(state.member||state.guest){next();return}modalRoot.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true"><p class="eyebrow">GUEST ACCESS</p><h2>광장에서 사용할 닉네임</h2><p>비회원도 닉네임으로 광장 스코어와 활동 기록을 남길 수 있습니다. 비회원 기록은 마지막 활동 후 3일 뒤 삭제됩니다.</p><form id="nickForm" class="nickform"><label for="guestNick">닉네임</label><input id="guestNick" class="nickinput" maxlength="12" autocomplete="off" placeholder="2–12자"><div id="nickError" class="error"></div><button class="pillbtn" type="submit">닉네임 만들기</button></form><button class="pillbtn secondary" data-close-modal>취소</button></section></div>`;const f=document.getElementById('nickForm');f.onsubmit=e=>{e.preventDefault();const v=document.getElementById('guestNick').value.trim().replace(/\s+/g,' ');if(v.length<2||v.length>12||!/^[가-힣a-zA-Z0-9 ]+$/.test(v)){document.getElementById('nickError').textContent='2–12자의 한글·영문·숫자로 입력해주세요.';return}state.guest={nickname:v,score:0,expiresAt:Date.now()+THREE_DAYS};localStorage.setItem(GUEST_KEY,JSON.stringify(state.guest));modalRoot.innerHTML='';next()};bind()}
function enterStudy(id){if(getCooldown(id))return;ensureGuest(()=>{state.activeStudy=id;modalRoot.innerHTML='';nav('publicRoom')})}
function publicRoom(){const s=studies.find(x=>x.id===state.activeStudy)||studies[1];view.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">LIVE STUDY · ${s.people} PARTICIPANTS</p><h1 class="title">${esc(s.title)}</h1></div><button class="pillbtn danger" data-exit-study>퇴장하기</button></div><div class="room-stage"><article class="card live-room">${scene(s)}<div class="room-content"><p class="eyebrow">FOCUS SESSION</p><h1>지금은 머무르는 시간</h1><p class="copy">${esc(s.summary)}</p><div class="room-toolbar"><div class="room-stat"><span>현재 세션<strong>28:14</strong></span><span>참여자<strong>${s.people}명</strong></span><span>다음 휴식<strong>11분 후</strong></span></div><button class="pillbtn secondary" data-drop-test>연결 끊김 테스트</button></div></div></article><aside class="side-stack"><section class="card panel"><p class="eyebrow">ROOM RULE</p><h2>집중을 지키는 약속</h2><ul class="rulelist"><li>${esc(s.rule)}</li><li>자발적 퇴장 후 1시간 재입장 제한</li><li>네트워크 오류는 3분 재접속 유예</li></ul></section><section class="card panel locked-panel"><span class="lock">🔒</span><p class="eyebrow">HOST BENEFITS · LOCKED</p><h2>방장 혜택 / 운영 권한</h2><p>공익 스터디를 안정적으로 운영하는 방장에게 제공할 혜택과 관리 기능입니다. 현재는 잠겨 있습니다.</p><strong>방장 교체 검토 원칙</strong><p>신고 수나 단순 다수결만으로 교체하지 않습니다. 관리 공백, 출석·운영 지속성, 규칙 집행의 일관성, 신고 내용의 근거와 반복성, 악의적 신고 패턴을 함께 검토합니다.</p></section></aside></div></section>`}
function showExit(){const s=studies.find(x=>x.id===state.activeStudy);modalRoot.innerHTML=`<div class="modalback"><section class="modal" role="alertdialog" aria-modal="true"><p class="eyebrow">LEAVE STUDY</p><h2>정말 퇴장하시겠습니까?</h2><p><b>${esc(s.title)}</b>에서 자발적으로 퇴장하면 <b>1시간 동안 이 스터디에 다시 입장할 수 없습니다.</b> 공부 흐름을 지키기 위한 정책입니다.</p><div class="notice">실수로 브라우저가 끊기거나 네트워크 오류가 난 경우에는 퇴장 처리하지 않고 3분간 재접속을 허용합니다.</div><div class="actions">${button('계속 공부하기',true,'data-close-modal')}${button('최종 퇴장',false,'data-confirm-exit class="pillbtn danger"')}</div></section></div>`;bind()}
function confirmExit(){const id=state.activeStudy;state.cooldowns[id]=Date.now()+ONE_HOUR;localStorage.setItem(COOLDOWN_KEY,JSON.stringify(state.cooldowns));state.activeStudy=null;modalRoot.innerHTML='';nav('plaza');toast('퇴장했습니다. 이 스터디는 1시간 후 다시 입장할 수 있어요.')}
function dropTest(){reconnectRoot.innerHTML=`<div class="reconnect">연결이 끊겼습니다 · 3분 내 같은 세션으로 재접속합니다…</div>`;setTimeout(()=>{reconnectRoot.innerHTML='';toast('기존 스터디 세션으로 재연결되었습니다. 쿨타임은 적용되지 않았어요.')},1600)}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function newQuiz(){const old=new Set(state.lastQuizIds);let pool=questionBank.filter(q=>!old.has(q.id));if(pool.length<10)pool=questionBank;state.quiz=shuffle(pool).slice(0,10);state.lastQuizIds=state.quiz.map(q=>q.id);localStorage.setItem(QUIZ_KEY,JSON.stringify(state.lastQuizIds));state.q=0;state.answered=null;state.score=0;state.completed=false}
function startQuiz(){newQuiz()}
function quiz(){if(!state.quiz.length)newQuiz();const x=state.quiz[state.q];const name=state.member?'STUDY-8F2A':state.guest?.nickname||'GUEST';const ranks=[...board,{name,type:state.member?'MEMBER':'GUEST · 3D',score:state.score,me:true}].sort((a,b)=>b.score-a.score).slice(0,8);const body=state.completed?`<div class="complete"><p class="eyebrow">BASIC TEST COMPLETE</p><h2>이번 10문제를 모두 풀었어요.</h2><strong>${state.score}점</strong><p class="copy">재시험은 방금 풀었던 문항을 우선 제외해 새로운 10문제를 구성합니다.</p><div class="actions">${button('새 문제로 재시험',false,'data-retest')}${button('광장으로',true,'data-go="plaza"')}</div></div>`:`<div class="qmeta"><span>BASIC · ${esc(x.category)} · ${String(state.q+1).padStart(2,'0')} / 10</span><span>10 PTS</span></div><div class="progress"><span style="width:${(state.q+1)*10}%"></span></div><h2>${esc(x.q)}</h2><div class="choices">${x.choices.map((c,i)=>`<button class="choice ${state.answered===null?'':i===x.answer?'correct':state.answered===i?'wrong':''}" data-answer="${i}" ${state.answered===null?'':'disabled'}><b>${String.fromCharCode(65+i)}</b>${esc(c)}</button>`).join('')}</div>${state.answered!==null?`<div class="result ${state.answered===x.answer?'good':''}"><strong>${state.answered===x.answer?'정답입니다.':'정답은 '+esc(x.choices[x.answer])+'입니다.'}</strong><span>+${state.answered===x.answer?10:0} · ${state.score}점</span><p>${esc(x.explain)}</p>${button(state.q===9?'결과 보기':'다음 문제',true,'data-next')}</div>`:''}`;view.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">PLAZA · BASIC TEST</p><h1 class="title">기본 상식 테스트</h1></div><button class="pillbtn secondary" data-go="plaza">광장으로</button></div><div class="question-layout"><article class="card question">${body}</article><aside class="card score"><p class="eyebrow">PUBLIC LEADERBOARD</p><h2>공개 스코어</h2><div class="myscore"><span>${esc(name)}<br>${state.member?'회원':'비회원 · 3일 보관'}</span><strong>${state.score}</strong></div><ol class="ranking">${ranks.map((r,i)=>`<li><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="player">${esc(r.name)}<small>${r.type}${r.me?' · YOU':''}</small></span><strong>${r.score}</strong></li>`).join('')}</ol><p class="fine">공개 랭킹은 로그인 여부와 상관없이 누구나 확인할 수 있습니다. 비회원 점수와 닉네임은 마지막 활동 3일 후 삭제됩니다.</p></aside></div></section>`}
function login(){view.innerHTML=`<section class="page narrow"><p class="eyebrow">MEMBER ACCESS</p><h1 class="title">내 학습공간 시작하기</h1><p class="copy">개인 학습공간과 파일 저장은 로그인 회원에게만 제공됩니다.</p><div class="login-stack"><button class="social" data-login="google"><i>G</i>Google로 계속하기<span class="status"></span></button><button class="social" data-login="kakao"><i>K</i>카카오로 계속하기<span class="status"></span></button></div><div class="notice">Preview에서는 OAuth 대신 눌림 → 연결 중 → 로그인 완료 상태를 시뮬레이션합니다.</div></section>`}
function startLogin(el,provider){el.disabled=true;el.classList.add('pressed');el.querySelector('.status').textContent='연결 중…';setTimeout(()=>{state.member=true;state.provider=provider;el.classList.remove('pressed');modalRoot.innerHTML=`<div class="modalback"><section class="modal"><p class="eyebrow">OAUTH PREVIEW</p><h2>${provider==='google'?'Google':'Kakao'} 로그인 완료</h2><p>실제 서비스에서는 OAuth 성공 후 회원 세션이 발급됩니다.</p><div class="actions">${button('내 학습공간으로',false,'data-modal-rooms')}${button('광장으로',true,'data-modal-plaza')}</div></section></div>`;sessionUI();bind()},650)}
function rooms(){if(!state.member){nav('login');return}const remain=Math.max(0,5-state.rooms.length);const cd=state.lastCreateAt?Math.max(0,24*60*60*1000-(Date.now()-state.lastCreateAt)):0;view.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">YOUR LEARNING WORLDS</p><h1 class="title">내 학습공간</h1><p class="copy">목표 한 줄만으로 시작하고, 필요할 때 자료와 링크를 더해 정밀하게 다듬습니다.</p></div><div class="room-head-actions"><span class="publicpill">${state.rooms.length} / 5 ROOMS</span><button class="pillbtn" data-create-space ${remain===0||cd?'disabled':''}>+ 새 학습공간</button></div></div><div class="limit-panel"><div><small>최대 보유</small><strong>5개</strong></div><div><small>새 공간 생성</small><strong>24시간에 1개</strong></div><div><small>미활동</small><strong>14일 후 보관</strong></div></div>${cd?`<p class="cooldown-note">새 공간 생성까지 ${fmt(cd)} 남았습니다. 기존 공간은 언제든 수정할 수 있습니다.</p>`:''}${state.rooms.length?`<div class="roomlist">${state.rooms.map(r=>`<button class="roomrow" data-open-room="${r.id}"><span><small>PERSONAL SPACE · ${esc(r.created||'최근')}</small><strong>${esc(r.title)}</strong></span><span>${(r.materials||[]).length+(r.links||[]).length+(r.archive||[]).length} 연결 자료 · OPEN →</span></button>`).join('')}</div>`:`<div class="empty-space"><h2>아직 학습공간이 없어요.</h2><p>목표나 공부할 주제 한 줄이면 첫 공간을 만들 수 있습니다.</p><button class="pillbtn" data-create-space>첫 학습공간 만들기</button></div>`}</section>`}
function createSpace(){if(!state.member){nav('login');return}state.builderFiles=[];state.builderPresets=new Set();state.builderArchive=new Set();state.builderLinks=[];view.innerHTML=`<section class="page"><div class="heading"><div><p class="eyebrow">CREATE YOUR LEARNING WORLD</p><h1 class="title">목표부터 가볍게 시작</h1><p class="copy">자료가 없어도 됩니다. 자격증 이름, 시험 날짜, 오늘 공부할 주제처럼 한 줄만 적으면 기본 학습공간을 만들 수 있습니다.</p></div><button class="pillbtn secondary" data-go="rooms">취소</button></div><form id="spaceBuilder" class="builder"><section class="card builder-step"><div class="step-head"><span class="step-num">01</span><div><h2>무엇을 공부할까요?</h2><p>목표 또는 주제 하나가 유일한 필수 입력입니다.</p></div></div><div class="two-fields"><div class="field"><label for="studyGoal">목표 · 주제</label><input id="studyGoal" class="textinput" maxlength="120" placeholder="예: 정보처리기사 실기 / 오늘 미적분 적분법"></div><div class="field"><label for="studyDday">시험 · 마감일 <span class="optional-label">선택</span></label><input id="studyDday" class="textinput" type="date"></div></div><p class="eyebrow" style="margin-top:24px">QUICK TEMPLATES</p><div class="template-grid">${studyTemplates.map(t=>`<button type="button" class="template-card" data-template="${t.id}"><small>${esc(t.meta)}</small><strong>${esc(t.title)}</strong><span>클릭해서 바로 채우기</span></button>`).join('')}</div><div class="plan-preview" id="planPreview"><strong>기본 스터디 틀</strong><p>목표를 입력하면 목표 정리 → 주간/일일 단위 → 확인 문제 → 복습 흐름으로 기본 틀을 구성합니다. 이 단계는 외부 AI 없이도 동작합니다.</p></div></section><section class="card builder-step"><div class="step-head"><span class="step-num">02</span><div><h2>더 정밀하게 만들기 <span class="optional-label">전부 선택</span></h2><p>자료가 없어도 바로 생성할 수 있습니다. 필요하면 PDF, URL, 공공 아카이브를 연결하세요.</p></div></div><div class="enrich-grid"><div><label class="upload-zone" for="studyFiles"><div><strong>PDF 자료 첨부</strong><span>문서가 있으면 내용 기반 복습과 문제 생성에 활용합니다.</span></div><input id="studyFiles" type="file" accept="application/pdf,.pdf" multiple></label><div id="fileList" class="file-list"></div></div><div class="url-box"><h3>링크 한 줄로 연결</h3><p>YouTube 강의, 블로그, 뉴스·학습 기사 등. 실제 서비스에서는 안전검사와 허용 정책을 통과한 URL만 분석합니다.</p><div class="inline-field"><input id="studyUrl" class="textinput" type="url" placeholder="https://..."><button type="button" class="pillbtn secondary" data-add-url>추가</button></div><div id="urlList" class="file-list"></div></div></div><p class="eyebrow" style="margin-top:25px">PUBLIC ARCHIVE · 불러오기</p><div class="archive-picks">${publicMaterials.map(x=>`<button type="button" class="archive-pick" data-archive="${x.id}"><span><strong>${esc(x.title)}</strong><small>${esc(x.meta)}</small></span><span>+ 연결</span></button>`).join('')}</div></section><section class="card builder-step"><div class="step-head"><span class="step-num">03</span><div><h2>어떻게 공부하고 싶나요?</h2><p>직접 설명하거나 선택지만 골라도 됩니다. 이것이 STUDYWORLD의 맞춤 규칙이 됩니다.</p></div></div><div class="field"><label for="studyInstruction">내 방식 설명 <span class="optional-label">선택</span></label><textarea id="studyInstruction" class="textarea" placeholder="예: 처음에는 쉽게 설명해주고, 한 단원이 끝날 때 5문제씩 내주세요. 틀린 문제는 다음날 다시 보고 싶어요."></textarea></div><div class="preset-group"><strong>학습 목표</strong><div class="chips"><button type="button" class="chip" data-preset="시험 대비">시험 대비</button><button type="button" class="chip" data-preset="개념 이해">개념 이해</button><button type="button" class="chip" data-preset="실무 활용">실무 활용</button><button type="button" class="chip" data-preset="빠른 복습">빠른 복습</button></div></div><div class="preset-group"><strong>선호 방식</strong><div class="chips"><button type="button" class="chip" data-preset="쉽게 설명">쉽게 설명</button><button type="button" class="chip" data-preset="핵심 요약">핵심 요약</button><button type="button" class="chip" data-preset="문제 풀이">문제 풀이</button><button type="button" class="chip" data-preset="반복 복습">반복 복습</button><button type="button" class="chip" data-preset="질문하며 학습">질문하며 학습</button></div></div><div class="preset-group"><strong>한 번에 공부할 시간</strong><div class="chips"><button type="button" class="chip" data-preset="20분씩">20분씩</button><button type="button" class="chip" data-preset="40분 집중">40분 집중</button><button type="button" class="chip" data-preset="60분 깊게">60분 깊게</button></div></div></section><section class="card builder-step"><div class="step-head"><span class="step-num">04</span><div><h2>이름을 정하고 시작하기</h2><p>기본 구조는 즉시 생성됩니다. AI가 연결된 경우 자료 해석과 계획 보강만 선택적으로 수행합니다.</p></div></div><div class="field"><label for="spaceTitle">학습공간 이름 <span class="optional-label">자동 제안 가능</span></label><input id="spaceTitle" class="textinput" maxlength="60" placeholder="비워두면 목표에서 자동 생성"></div><div class="builder-summary"><b>생성 원칙</b><p>목표만 있어도 생성 · 자료는 선택 · AI 장애/무료 한도 초과 시에도 기본 학습공간은 정상 동작 · 연결된 자료가 있을 때만 선택적으로 내용 기반 정밀화를 수행합니다.</p></div><div id="buildError" class="build-error"></div><div class="builder-actions"><button type="button" class="pillbtn secondary" data-go="rooms">닫기</button><button type="submit" class="pillbtn">학습공간 만들기</button></div></section></form></section>`}

/small><b>${esc(r.analysis.applied)}</b></div></div></section>`:''}<div class="room-detail-grid"><section class="card personal-main"><p class="eyebrow">STUDY BRIEF · ${String(r.layout).toUpperCase()}</p><h2>내 방식</h2><div class="instruction-box">${esc(r.instruction||'목표에 맞춰 기본 학습 틀로 시작합니다. 필요할 때 자료와 학습 방식을 더 추가할 수 있어요.')}</div><div class="study-meta" style="margin-top:14px">${(r.presets||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="tag">기본 학습 루틴</span>'}</div><p class="eyebrow" style="margin-top:30px">CONNECTED SOURCES</p><div class="source-summary">${sources.length?sources.map(([x,t])=>`<div class="source-row"><span>${esc(x)}</span><span>${t}</span></div>`).join(''):'<div class="source-row"><span>연결 자료 없음 · 목표 기반으로 시작</span><span>OPTIONAL</span></div>'}</div><p class="eyebrow">CURRENT PLAN</p><div class="plan-list">${plan.map((x,i)=>`<div class="plan-item"><b>${String(i+1).padStart(2,'0')}</b><strong>${x}</strong><small>${i===0?'START':'NEXT'}</small></div>`).join('')}</div></section><aside class="room-side"><section class="card panel"><p class="eyebrow">LEARNING ENGINE</p><h2>${sources.length?'자료와 목표를 함께 사용':'목표부터 바로 시작'}</h2><p class="fine">${sources.length?'연결 자료의 분석 결과를 현재 학습 순서·복습·문제 비중에 반영합니다. 실제 서비스에서는 분석 가능 범위와 AI 사용 여부를 명확히 표시합니다.':'자료가 없어도 공부를 시작할 수 있습니다. 필요해지는 순간 위의 ‘자료 추가’에서 연결하면 됩니다.'}</p><button class="pillbtn" style="width:100%" data-analysis-preview>${sources.length?'현재 계획 다시 분석':'오늘 공부 시작하기'}</button></section><section class="card panel locked-panel"><span class="lock">🔒</span><p class="eyebrow">INVITE · LOCKED</p><h2>초대하기</h2><p>추후 최대 10명의 소규모 학습공간으로 확장할 수 있습니다.</p><button class="pillbtn secondary lockbtn" disabled>준비 중</button></section></aside></div></section>`}
function openAddSources(){const r=state.rooms.find(x=>x.id===state.activeRoom);if(!r)return;modalRoot.innerHTML=`<div class="modalback"><section class="modal" role="dialog" aria-modal="true"><p class="eyebrow">ADD MATERIALS</p><h2>자료를 추가해 학습을 더 정밀하게</h2><p>자료를 넣으면 분석 결과가 현재 학습 순서와 복습 우선순위에 이어지도록 구성합니다.</p><div class="modal-section"><h3>PDF 추가</h3><p>Preview에서는 파일명만 연결합니다. 실제 서비스에서는 파일 검증 후 분석 작업으로 넘깁니다.</p><label class="upload-zone" for="roomFileInput"><div><strong>PDF 선택</strong><span>회원의 현재 학습공간에만 연결됩니다.</span></div><input id="roomFileInput" type="file" accept="application/pdf,.pdf" multiple></label></div><div class="modal-section"><h3>URL 연결</h3><p>안전검사를 통과한 공개 자료만 분석 대상으로 사용합니다.</p><div class="inline-field"><input id="roomUrlInput" class="textinput" type="url" placeholder="https://..."><button type="button" class="pillbtn secondary" data-room-add-url>추가</button></div></div><div class="modal-section"><h3>공공 아카이브</h3><div class="archive-picks">${publicMaterials.map(x=>`<button type="button" class="archive-pick" data-room-archive="${x.id}"><span><strong>${esc(x.title)}</strong><small>${esc(x.meta)}</small></span><span>+ 연결</span></button>`).join('')}</div></div><div class="modal-actions"><button class="pillbtn secondary" data-close-modal>닫기</button><button class="pillbtn" data-apply-sources>추가 자료 분석하기</button></div></section></div>`;bind()}

function bind(){
document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>nav(e.dataset.go));
document.querySelectorAll('[data-study-detail]').forEach(e=>e.onclick=()=>showStudyDetail(e.dataset.studyDetail));
document.querySelectorAll('[data-enter-study]').forEach(e=>e.onclick=()=>enterStudy(e.dataset.enterStudy));
document.querySelectorAll('[data-close-modal]').forEach(e=>e.onclick=()=>modalRoot.innerHTML='');
document.querySelectorAll('[data-exit-study]').forEach(e=>e.onclick=showExit);
document.querySelectorAll('[data-confirm-exit]').forEach(e=>e.onclick=confirmExit);
document.querySelectorAll('[data-drop-test]').forEach(e=>e.onclick=dropTest);
document.querySelectorAll('[data-basic-test]').forEach(e=>e.onclick=()=>ensureGuest(()=>{state.activeStudy=null;startQuiz();nav('quiz')}));
document.querySelectorAll('[data-login]').forEach(e=>e.onclick=()=>startLogin(e,e.dataset.login));
document.querySelectorAll('[data-answer]').forEach(e=>e.onclick=()=>{if(state.answered!==null)return;state.answered=Number(e.dataset.answer);if(state.answered===state.quiz[state.q].answer)state.score+=10;saveGuest();quiz();bind()});
document.querySelectorAll('[data-next]').forEach(e=>e.onclick=()=>{if(state.q===9)state.completed=true;else state.q++;state.answered=null;quiz();bind()});
document.querySelectorAll('[data-retest]').forEach(e=>e.onclick=()=>{newQuiz();quiz();bind();toast('직전 문제를 우선 제외한 새 10문제를 구성했어요.')});
document.querySelectorAll('[data-create-space]').forEach(e=>e.onclick=()=>nav('createSpace'));
document.querySelectorAll('[data-open-room]').forEach(e=>e.onclick=()=>{state.activeRoom=e.dataset.openRoom;nav('personalRoom')});
document.querySelectorAll('[data-preset]').forEach(e=>e.onclick=()=>{const k=e.dataset.preset;if(state.builderPresets.has(k)){state.builderPresets.delete(k);e.classList.remove('selected')}else{state.builderPresets.add(k);e.classList.add('selected')}});
document.querySelectorAll('[data-template]').forEach(e=>e.onclick=()=>{const t=studyTemplates.find(x=>x.id===e.dataset.template);if(!t)return;document.getElementById('studyGoal').value=t.goal;document.getElementById('spaceTitle').value=t.title;state.builderPresets=new Set(t.presets);document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('selected',state.builderPresets.has(b.dataset.preset)));updatePlanPreview();toast('템플릿을 적용했어요.')});
document.querySelectorAll('[data-archive]').forEach(e=>e.onclick=()=>{const id=e.dataset.archive;if(state.builderArchive.has(id)){state.builderArchive.delete(id);e.classList.remove('selected');e.lastElementChild.textContent='+ 연결'}else{state.builderArchive.add(id);e.classList.add('selected');e.lastElementChild.textContent='연결됨'}});
const goal=document.getElementById('studyGoal');if(goal)goal.oninput=updatePlanPreview;
const dday=document.getElementById('studyDday');if(dday)dday.onchange=updatePlanPreview;
const fileInput=document.getElementById('studyFiles');if(fileInput)fileInput.onchange=()=>{state.builderFiles=[...fileInput.files];const list=document.getElementById('fileList');list.innerHTML=state.builderFiles.length?state.builderFiles.map(f=>`<div class="file-item"><span>${esc(f.name)}</span><small>${(f.size/1024/1024).toFixed(1)} MB</small></div>`).join(''):''};
document.querySelectorAll('[data-add-url]').forEach(e=>e.onclick=()=>{const input=document.getElementById('studyUrl');const v=input.value.trim();const list=document.getElementById('urlList');try{const u=new URL(v);if(!['http:','https:'].includes(u.protocol))throw 0;if(state.builderLinks.length>=3){toast('Preview에서는 링크를 최대 3개까지 연결할 수 있어요.');return}state.builderLinks.push(u.href);input.value='';list.innerHTML=state.builderLinks.map(x=>`<div class="file-item"><span>${esc(x)}</span><small>URL</small></div>`).join('')}catch{toast('http 또는 https URL을 입력해주세요.')}});
const builder=document.getElementById('spaceBuilder');if(builder)builder.onsubmit=e=>{e.preventDefault();const goal=document.getElementById('studyGoal').value.trim();const title=document.getElementById('spaceTitle').value.trim()||goal.slice(0,32);const instruction=document.getElementById('studyInstruction').value.trim();const dday=document.getElementById('studyDday').value;const err=document.getElementById('buildError');if(!goal){err.textContent='공부할 목표나 주제를 한 줄 입력해주세요.';return}if(state.rooms.length>=5){err.textContent='개인 학습공간은 최대 5개까지 보유할 수 있습니다.';return}const room={id:'r'+Date.now(),title,goal,dday,materials:state.builderFiles.map(f=>f.name),links:[...state.builderLinks],archive:[...state.builderArchive],instruction:instruction||'목표에 맞는 기본 학습 흐름으로 시작하고 싶어요.',presets:[...state.builderPresets],created:'방금'};state.rooms.unshift(room);state.lastCreateAt=Date.now();state.activeRoom=room.id;toast('목표를 기반으로 학습공간을 만들었습니다.');nav('personalRoom')};
document.querySelectorAll('[data-add-sources]').forEach(e=>e.onclick=openAddSources);
document.querySelectorAll('[data-adjust-room]').forEach(e=>e.onclick=openAdjustRoom);
document.querySelectorAll('[data-layout]').forEach(e=>e.onclick=()=>{document.querySelectorAll('[data-layout]').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');e.closest('.modal').dataset.layout=e.dataset.layout});
const roomFile=document.getElementById('roomFileInput');if(roomFile)roomFile.onchange=()=>{const r=state.rooms.find(x=>x.id===state.activeRoom);if(r)r._pendingFiles=[...roomFile.files].map(f=>f.name)};
document.querySelectorAll('[data-room-add-url]').forEach(e=>e.onclick=()=>{const r=state.rooms.find(x=>x.id===state.activeRoom),input=document.getElementById('roomUrlInput');if(!r||!input)return;try{const u=new URL(input.value.trim());if(!['http:','https:'].includes(u.protocol))throw 0;r._pendingLinks=r._pendingLinks||[];r._pendingLinks.push(u.href);input.value='';toast('URL을 분석 대기 목록에 추가했어요.')}catch{toast('http 또는 https URL을 입력해주세요.')}});
document.querySelectorAll('[data-room-archive]').forEach(e=>e.onclick=()=>{const r=state.rooms.find(x=>x.id===state.activeRoom);if(!r)return;r._pendingArchive=r._pendingArchive||[];if(!r._pendingArchive.includes(e.dataset.roomArchive))r._pendingArchive.push(e.dataset.roomArchive);e.classList.add('selected');e.lastElementChild.textContent='연결됨'});
document.querySelectorAll('[data-apply-sources]').forEach(e=>e.onclick=()=>{const r=state.rooms.find(x=>x.id===state.activeRoom);if(!r)return;r.materials=[...(r.materials||[]),...(r._pendingFiles||[])];r.links=[...(r.links||[]),...(r._pendingLinks||[])];r.archive=[...new Set([...(r.archive||[]),...(r._pendingArchive||[])])];delete r._pendingFiles;delete r._pendingLinks;delete r._pendingArchive;r.analysis={status:'ready',topics:'핵심 개념 6개',focus:'새 자료 우선 복습',applied:'오늘 계획 반영'};modalRoot.innerHTML='';toast('자료 분석 결과를 현재 학습 계획에 반영했어요.');personalRoom();bind()});
document.querySelectorAll('[data-save-adjustment]').forEach(e=>e.onclick=()=>{const r=state.rooms.find(x=>x.id===state.activeRoom);if(!r)return;const modal=e.closest('.modal');r.layout=modal.dataset.layout||r.layout||'balanced';const text=document.getElementById('roomAdjustText').value.trim();if(text){r.adjustRequest=text;r.instruction=text}modalRoot.innerHTML='';toast('학습공간 구성을 변경했어요.');personalRoom();bind()});
const sf=document.getElementById('supportForm');if(sf)sf.onsubmit=e=>{e.preventDefault();const title=document.getElementById('supportTitle').value.trim(),body=document.getElementById('supportBody').value.trim(),status=document.getElementById('supportStatus');if(!title||body.length<10){status.textContent='제목과 10자 이상의 문의 내용을 입력해주세요.';return}status.textContent='Preview: 문의가 접수되었습니다. 실제 서비스에서는 접수번호와 처리 상태를 저장합니다.';sf.querySelector('button[type="submit"]').disabled=true};
document.querySelectorAll('[data-analysis-preview]').forEach(e=>e.onclick=()=>{e.disabled=true;const old=e.textContent;e.textContent=old.includes('시작')?'학습 준비 중…':'계획 다듬는 중…';setTimeout(()=>{e.textContent=old.includes('시작')?'공부 시작 준비 완료':'맞춤 계획 준비 완료';toast('Preview: 기본 기능은 AI 없이도 동작하고, 연결 자료가 있을 때만 선택적으로 AI가 보강합니다.')},650)});
document.querySelectorAll('[data-modal-rooms]').forEach(e=>e.onclick=()=>{modalRoot.innerHTML='';nav('rooms')});
document.querySelectorAll('[data-modal-plaza]').forEach(e=>e.onclick=()=>{modalRoot.innerHTML='';nav('plaza')})
}
function updatePlanPreview(){const box=document.getElementById('planPreview'),goal=document.getElementById('studyGoal');if(!box||!goal)return;const g=goal.value.trim(),d=document.getElementById('studyDday')?.value;if(!g){box.innerHTML='<strong>기본 스터디 틀</strong><p>목표를 입력하면 목표 정리 → 주간/일일 단위 → 확인 문제 → 복습 흐름으로 기본 틀을 구성합니다. 이 단계는 외부 AI 없이도 동작합니다.</p>';return}box.innerHTML=`<strong>${esc(g.length>48?g.slice(0,48)+'…':g)}</strong><p>${d?`목표일 ${esc(d)}까지의 남은 기간을 기준으로 `:'기간을 자유롭게 조정할 수 있는 '}기본 학습 단위를 만들고, 매 회차 확인 문제와 누적 복습 흐름을 붙입니다. 자료를 추가하면 이후 더 정밀하게 다듬을 수 있습니다.</p>`}
load();sessionButton.onclick=()=>{if(state.member){state.member=false;state.provider=null;state.page='home';toast('로그아웃했습니다.');render()}else nav('login')};render();
})();
</script>
</body>
</html>
